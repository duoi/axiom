name: Axiom
options:
  bundleIdPrefix: com.stevenjohns
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
settings:
  SWIFT_VERSION: "6.0"
  MACOSX_DEPLOYMENT_TARGET: "26.0"
  SWIFT_STRICT_CONCURRENCY: complete
packages:
  KeyboardShortcuts:
    url: https://github.com/sindresorhus/KeyboardShortcuts
    from: "2.2.4"
  ThinkingOrbs:
    url: https://github.com/haplollc/ThinkingOrbs
    from: "1.0.0"
targets:
  Axiom:
    type: application
    platform: macOS
    sources:
      - path: AIHUD
        excludes:
          - Info.plist
          - AIHUD.entitlements
          - Assets/AxiomLogo.png
    dependencies:
      - package: KeyboardShortcuts
      - package: ThinkingOrbs
    postBuildScripts:
      - name: Copy dev endpoint
        basedOnDependencyAnalysis: false
        script: |
          if [ -f "$SRCROOT/Config/dev-endpoint.json" ]; then
            cp "$SRCROOT/Config/dev-endpoint.json" "$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH/dev-endpoint.json"
          fi
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.stevenjohns.Axiom
        PRODUCT_NAME: Axiom
        INFOPLIST_FILE: AIHUD/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: AIHUD/AIHUD.entitlements
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        ENABLE_TESTABILITY: YES
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      configs:
        Debug:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: "Apple Development: steven@sjohns.net (6V6MHJBVWL)"
          DEVELOPMENT_TEAM: S7D8Q56TGV
  AxiomTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: AIHUDTests
    dependencies:
      - target: Axiom
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.stevenjohns.AxiomTests
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Axiom.app/Contents/MacOS/Axiom"
        BUNDLE_LOADER: "$(TEST_HOST)"
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
      configs:
        Debug:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: "Apple Development: steven@sjohns.net (6V6MHJBVWL)"
          DEVELOPMENT_TEAM: S7D8Q56TGV
schemes:
  Axiom:
    build:
      targets:
        Axiom: all
        AxiomTests: [test]
    test:
      targets:
        - AxiomTests
