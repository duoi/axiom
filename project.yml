name: Axiom
options:
  bundleIdPrefix: com.duoi
  developmentLanguage: en
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
settings:
  SWIFT_VERSION: "6.0"
  MACOSX_DEPLOYMENT_TARGET: "26.0"
  SWIFT_STRICT_CONCURRENCY: complete
  LOCALIZATION_PREFERS_STRING_CATALOGS: YES
  SWIFT_EMIT_LOC_STRINGS: YES
packages:
  KeyboardShortcuts:
    url: https://github.com/sindresorhus/KeyboardShortcuts
    from: "2.2.4"
  ThinkingOrbs:
    url: https://github.com/haplollc/ThinkingOrbs
    from: "1.0.0"
targets:
  Axiom:
    type: application
    platform: macOS
    sources:
      - path: AIHUD
        excludes:
          - Info.plist
          - AIHUD.entitlements
          - Assets/AxiomLogo.png
    dependencies:
      - package: KeyboardShortcuts
      - package: ThinkingOrbs
    postBuildScripts:
      - name: Copy dev endpoint
        basedOnDependencyAnalysis: false
        script: |
          /bin/sh "$SRCROOT/Scripts/copy-dev-endpoint.sh"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.duoi.axiom
        PRODUCT_NAME: Axiom
        INFOPLIST_FILE: AIHUD/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: AIHUD/AIHUD.entitlements
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_STYLE: Manual
        ENABLE_TESTABILITY: YES
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      configs:
        Debug:
          xcconfig: Config/Signing.xcconfig
        Release:
          CODE_SIGN_IDENTITY: "-"
  AxiomTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: AIHUDTests
    dependencies:
      - target: Axiom
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.duoi.axiomTests
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Axiom.app/Contents/MacOS/Axiom"
        BUNDLE_LOADER: "$(TEST_HOST)"
        CODE_SIGN_STYLE: Manual
      configs:
        Debug:
          xcconfig: Config/Signing.xcconfig
        Release:
          CODE_SIGN_IDENTITY: "-"
schemes:
  Axiom:
    build:
      targets:
        Axiom: all
        AxiomTests: [test]
    test:
      targets:
        - AxiomTests
