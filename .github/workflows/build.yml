name: Build

# Releases are intentional: a v* tag or a manual run. Pushes to main only run the tests, and only when code changed.
# (Path filters are not applied to tag pushes, so a v* tag always runs.)
on:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - "AIHUD/**"
      - "AIHUDTests/**"
      - "Axiom.xcodeproj/**"
      - "Config/*.xcconfig"
      - "Scripts/**"
      - "project.yml"
      - ".github/workflows/build.yml"
  workflow_dispatch:

# Tests and the build compile third-party packages, so they only get read access.
permissions:
  contents: read

env:
  RELEASE: ${{ startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch' }}

jobs:
  build:
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Select Xcode
        run: |
          if [ -d /Applications/Xcode.app ]; then
            sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          fi
          xcodebuild -version

      - name: Test
        run: |
          xcodebuild test \
            -scheme Axiom \
            -destination 'platform=macOS,arch=arm64' \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM=""

      - name: Build Release
        if: env.RELEASE == 'true'
        run: |
          xcodebuild build \
            -scheme Axiom \
            -configuration Release \
            -destination 'platform=macOS,arch=arm64' \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM=""
          ditto -c -k --keepParent \
            "$RUNNER_TEMP/DerivedData/Build/Products/Release/Axiom.app" \
            Axiom-macOS.zip

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: env.RELEASE == 'true'
        with:
          name: Axiom-macOS
          path: Axiom-macOS.zip

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: Axiom-macOS

      - name: Publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            tag="${GITHUB_REF#refs/tags/}"
          else
            tag="build-${GITHUB_SHA::7}"
          fi
          notes="${COMMIT_MESSAGE%%$'\n'*}"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" Axiom-macOS.zip --clobber
          else
            gh release create "$tag" Axiom-macOS.zip \
              --target "$GITHUB_SHA" \
              --title "Axiom $tag" \
              --notes "${notes:-Build ${GITHUB_SHA::7}}" \
              --latest
          fi
